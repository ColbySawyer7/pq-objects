[package]
name = "pq-objectstore"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Post-quantum encrypted object storage for S3-compatible services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ColbySawyer7/pq-objects"
documentation = "https://docs.rs/pq-objectstore"
readme = "README.md"
keywords = [
    "post-quantum",
    "s3",
    "encryption",
    "object-storage",
    "ml-kem",
]
categories = [
    "cryptography",
    "web-programming",
]
exclude = [
    ".github/*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["store", "s3", "local-keys"]
# Async object store + backends (tokio). Disable for wasm / JS+R2 flows.
store = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:tempfile",
    "dep:async-trait",
    "dep:futures",
    "dep:bytes",
]
s3 = [
    "store",
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-credential-types",
]
local-keys = []
tracing = ["dep:tracing"]
# Thin wasm-bindgen surface for Cloudflare Workers / Next.js (JS owns R2).
wasm = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:getrandom",
    "getrandom/wasm_js",
]

[dependencies]
aes-gcm = { version = "0.11", features = ["alloc", "getrandom"] }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
rand = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["io-util", "rt", "macros", "fs", "sync"] }
tokio-util = { version = "0.7", optional = true, features = ["io"] }
tempfile = { version = "3", optional = true }

aws-config = { version = "1", optional = true, default-features = true, features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true, default-features = true, features = ["behavior-version-latest"] }
tracing = { version = "0.1", optional = true }

getrandom = { version = "0.4", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "local_key"
required-features = ["local-keys", "store"]

[[example]]
name = "r2"
required-features = ["s3", "local-keys"]

[[example]]
name = "minio"
required-features = ["s3", "local-keys"]

[[example]]
name = "bench"
required-features = ["local-keys", "store"]

[[example]]
name = "seal_bytes"
required-features = ["local-keys"]
