[package]
name = "pq-objectstore"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Post-quantum encrypted object storage for S3-compatible services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ColbySawyer7/pq-objects"
documentation = "https://docs.rs/pq-objectstore"
readme = "README.md"
keywords = [
    "post-quantum",
    "s3",
    "encryption",
    "object-storage",
    "ml-kem",
]
categories = [
    "cryptography",
    "web-programming",
]
exclude = [
    ".github/*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["s3", "local-keys"]
s3 = [
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-credential-types",
]
local-keys = []
tracing = ["dep:tracing"]

[dependencies]
aes-gcm = { version = "0.11", features = ["alloc", "getrandom"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
rand = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "macros", "fs", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

aws-config = { version = "1", optional = true, default-features = true, features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true, default-features = true, features = ["behavior-version-latest"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "local_key"
required-features = ["local-keys"]

[[example]]
name = "r2"
required-features = ["s3", "local-keys"]

[[example]]
name = "minio"
required-features = ["s3", "local-keys"]

[[example]]
name = "bench"
required-features = ["local-keys"]
